<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NovaCorp Campus</title>
<link rel="stylesheet" href="/static/campus.css">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="hud" class="card">
  <h1 class="serif">NovaCorp</h1>
  <div class="sub">Click a department to see its agent</div>
  <div id="rooms"></div>
  <div id="srv">Connecting to the agents…</div>
  <div id="views">
    <button id="bOver">Overview</button>
    <button id="bDC">Data center</button>
    <button id="bOut">Outside</button>
    <button id="bDecor">Scenery: City</button>
    <button id="bFollow" style="display:none">Follow</button>
    <button onclick="location.href='/'">← Back to CRM</button>
  </div>
  <div id="follow"></div>
</div>
<nav id="dock" class="card"></nav>
<aside id="panel" class="card closed">
  <header>
    <div class="badge" id="pBadge"></div>
    <div class="grow"><h2 class="serif" id="pTitle"></h2><p id="pRole"></p></div>
    <span class="pill" id="pState">idle</span>
    <button id="pClose" title="Close">✕</button>
  </header>
  <div id="pbody"></div>
</aside>
<script type="module" src="/static/campus.js"></script>
</body>
</html>
